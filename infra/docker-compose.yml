# Local development services: Postgres, Redis, Mailpit, and S3-compatible storage (SeaweedFS) for lesson files.
# Start: docker compose -f infra/docker-compose.yml up -d --wait
# The API image too (instead of `pnpm dev`'s API): add `--profile api`; run `pnpm db:migrate` and `pnpm storage:setup` first.
# Host ports can be overridden with POSTGRES_PORT, REDIS_PORT, MAILPIT_SMTP_PORT, MAILPIT_UI_PORT, STORAGE_PORT, API_PORT.
name: reanit-lms

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: reanit
      POSTGRES_PASSWORD: reanit
      POSTGRES_DB: reanit
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reanit -d reanit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 API on :8333 with the access key in seaweedfs/s3.json. (MinIO no longer publishes free images.)
  # Run `pnpm storage:setup` once to create the bucket and its CORS rule for browser uploads.
  storage:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [api]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://reanit:reanit@postgres:5432/reanit
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: "Reanit <no-reply@reanit.localhost>"
      S3_ENDPOINT: http://storage:8333
      # Presigned URLs must name a host the browser reaches.
      S3_PUBLIC_ENDPOINT: http://localhost:${STORAGE_PORT:-8333}
      S3_BUCKET: reanit-media
      S3_ACCESS_KEY_ID: reanit
      S3_SECRET_ACCESS_KEY: reanit-secret
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      storage:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  storage-data:
