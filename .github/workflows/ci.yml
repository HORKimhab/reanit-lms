name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip
      - run: pnpm dup

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://reanit:reanit@localhost:5432/reanit
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: "Reanit <no-reply@reanit.localhost>"
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: reanit-media
      S3_ACCESS_KEY_ID: reanit
      S3_SECRET_ACCESS_KEY: reanit-secret
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis mailpit storage
      - run: pnpm build
      - run: pnpm --filter @reanit/db exec prisma migrate deploy
      - run: pnpm --filter api storage:setup
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Every green push to main goes to staging once the repository variable DEPLOY_STAGING is "true"
  # (infra/deploy/README.md); production is deployed by hand from the Deploy workflow.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true'
    needs: [check, e2e]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
