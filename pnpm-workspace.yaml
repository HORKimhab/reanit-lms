  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 1.59.0
  next: 16.4.2
  next-intl: 4.14.9
  next-themes: 0.4.6
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  "@eslint/js": 10.0.1
  eslint: 10.13.0
  globals: 17.13.0
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  "@vitejs/plugin-react": 6.1.2
  eslint-plugin-jsdoc: 65.3.12
  jscpd: 5.4.1
  jsdom: 30.1.3
  knip: 6.42.0
  vitest: 5.0.5
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  zod: 4.6.5
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1
  "@testcontainers/postgresql": 12.2.1
  nodemailer: 10.0.16
  "@nestjs/common": 12.1.3
  "@nestjs/core": 12.1.3
  "@nestjs/platform-fastify": 12.1.3
  "@nestjs/terminus": 12.1.0
  "@nestjs/testing": 12.1.3
  "@swc/core": 1.16.17
  ioredis: 5.11.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  tsup: 8.5.1
  unplugin-swc: 2.0.0
  nestjs-cls: 7.0.1
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  "@fastify/helmet": 13.2.0
  fastify: 5.12.5
  "@fastify/cookie": 11.1.3
  supertest: 7.3.1
  "@nestjs/bullmq": 12.0.0
  bullmq: 6.3.11
  "@aws-sdk/client-s3": 3.1146.0
  "@aws-sdk/s3-request-presigner": 3.1146.0
  "@types/supertest": 7.2.1
  "@nestjs/swagger": 12.0.2
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0

# Install scripts: true = allowed, false = skipped (prebuilt binaries are enough).
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
  "@prisma/engines": true
  # Telemetry ping pulled in by @nestjs/swagger.
  "@scarf/scarf": false
  prisma: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# openapi-typescript 7 declares typescript ^5 but generates correctly with 6.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

minimumReleaseAgeExclude:
  - eslint-plugin-jsdoc@65.3.12
  - knip@6.42.0
